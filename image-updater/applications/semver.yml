apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: follow-semver02
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: example=ghcr.io/namsee04/gitops-cert-level-2-examples:~1.0
    argocd-image-updater.argoproj.io/example.update-strategy: semver
spec:
  project: default

  source:
    repoURL: https://github.com/NamSee04/gitops-cert-level-2-examples.git
    targetRevision: HEAD
    path: ./image-updater/example-app/envs/staging/
   
  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  # Sync policy
  syncPolicy:
    syncOptions:
      - CreateNamespace=true  
   
